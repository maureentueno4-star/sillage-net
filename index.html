<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sillage — Comparateur de Prix Parfums</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:    #0e0c0a;
    --paper:  #faf8f4;
    --gold:   #c9a84c;
    --gold2:  #e8c97a;
    --muted:  #8a8278;
    --border: rgba(201,168,76,.2);
    --glass:  rgba(250,248,244,.06);
    --r:      3px;
  }
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { background:var(--ink); color:var(--paper); font-family:'DM Sans',sans-serif; font-weight:300; min-height:100vh; overflow-x:hidden; }
  body::before {
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 80% 50% at 15% 10%, rgba(201,168,76,.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 85% 90%, rgba(201,168,76,.05) 0%, transparent 60%);
  }
  body::after {
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.03;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size:200px;
  }
  .page { position:relative; z-index:1; max-width:820px; margin:0 auto; padding:0 28px; }

  header { padding:72px 0 52px; text-align:center; animation:fadeDown .8s ease both; }
  .brand { display:inline-flex; align-items:center; gap:14px; margin-bottom:28px; }
  .brand-line { width:52px; height:1px; background:linear-gradient(90deg,transparent,var(--gold)); }
  .brand-line.r { background:linear-gradient(90deg,var(--gold),transparent); }
  .brand-dot { width:5px; height:5px; background:var(--gold); border-radius:50%; }
  .site-name { font-family:'Playfair Display',serif; font-size:clamp(3rem,7vw,5rem); font-weight:400; letter-spacing:.06em; line-height:1; margin-bottom:10px; }
  .site-name em { font-style:italic; color:var(--gold2); }
  .tagline { font-size:.72rem; letter-spacing:.28em; text-transform:uppercase; color:var(--muted); }

  .search-area { margin-bottom:52px; animation:fadeDown .8s .1s ease both; }
  .search-label { display:block; font-size:.68rem; letter-spacing:.26em; text-transform:uppercase; color:var(--muted); margin-bottom:14px; }
  .search-row { display:flex; border:1px solid var(--border); background:var(--glass); backdrop-filter:blur(10px); transition:border-color .3s; }
  .search-row:focus-within { border-color:var(--gold); }
  #q { flex:1; background:transparent; border:none; outline:none; padding:18px 22px; font-family:'Playfair Display',serif; font-size:1.25rem; font-style:italic; color:var(--paper); letter-spacing:.03em; }
  #q::placeholder { color:rgba(250,248,244,.22); }
  #go { background:var(--gold); border:none; padding:18px 30px; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:.7rem; font-weight:500; letter-spacing:.2em; text-transform:uppercase; color:var(--ink); transition:background .25s,transform .1s; white-space:nowrap; }
  #go:hover { background:var(--gold2); }
  #go:active { transform:scale(.98); }
  #go:disabled { opacity:.45; cursor:not-allowed; }

  .pills { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; align-items:center; }
  .pills-label { font-size:.66rem; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); }
  .pill { background:transparent; border:1px solid var(--border); color:rgba(250,248,244,.6); padding:5px 13px; font-family:'DM Sans',sans-serif; font-size:.72rem; letter-spacing:.08em; cursor:pointer; transition:all .2s; border-radius:var(--r); }
  .pill:hover { border-color:var(--gold); color:var(--gold2); background:rgba(201,168,76,.06); }

  #loading { display:none; text-align:center; padding:56px 0; }
  .spinner { width:40px; height:40px; border:1px solid var(--border); border-top-color:var(--gold); border-radius:50%; animation:spin 1.1s linear infinite; margin:0 auto 22px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .load-msg { font-size:.7rem; letter-spacing:.24em; text-transform:uppercase; color:var(--muted); animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }

  #error { display:none; border:1px solid rgba(220,80,80,.3); background:rgba(220,80,80,.05); padding:20px 24px; border-radius:var(--r); font-size:.85rem; color:rgba(250,248,244,.65); line-height:1.7; }
  #results { display:none; }

  .results-meta { display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:28px; padding-bottom:18px; border-bottom:1px solid var(--border); }
  .results-name { font-family:'Playfair Display',serif; font-size:1.5rem; font-weight:400; }
  .results-name em { font-style:italic; color:var(--gold2); }
  .economy-badge { font-size:.64rem; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); border:1px solid var(--gold); padding:4px 12px; border-radius:var(--r); }

  .cards { display:flex; flex-direction:column; gap:2px; margin-bottom:36px; }
  .card { display:grid; grid-template-columns:1fr auto auto; align-items:center; gap:18px; padding:20px 24px; background:var(--glass); border:1px solid var(--border); border-radius:var(--r); text-decoration:none; color:inherit; transition:all .22s; animation:riseUp .4s ease both; }
  @keyframes riseUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .card:nth-child(1){animation-delay:.04s}.card:nth-child(2){animation-delay:.09s}.card:nth-child(3){animation-delay:.14s}.card:nth-child(4){animation-delay:.19s}.card:nth-child(5){animation-delay:.24s}.card:nth-child(6){animation-delay:.29s}
  .card:hover { border-color:rgba(201,168,76,.45); background:rgba(201,168,76,.05); transform:translateX(3px); }
  .card.winner { border-color:var(--gold); background:rgba(201,168,76,.07); }
  .card-store { font-size:.92rem; font-weight:400; letter-spacing:.05em; margin-bottom:3px; display:flex; align-items:center; gap:8px; }
  .winner-tag { font-size:.58rem; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); border:1px solid var(--gold); padding:2px 8px; border-radius:var(--r); }
  .card-source { font-size:.65rem; color:var(--gold2); opacity:.7; text-decoration:underline; text-underline-offset:3px; }
  .card-status { font-size:.62rem; letter-spacing:.14em; text-transform:uppercase; padding:3px 9px; border:1px solid; border-radius:var(--r); white-space:nowrap; color:#7ec47e; border-color:rgba(126,196,126,.35); }
  .card-price { text-align:right; white-space:nowrap; }
  .price-main { font-family:'Playfair Display',serif; font-size:1.45rem; font-weight:400; display:block; }
  .card.winner .price-main { color:var(--gold2); }
  .price-diff { font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); }

  .summary { border:1px solid var(--border); padding:24px 28px; background:var(--glass); border-radius:var(--r); margin-bottom:28px; animation:riseUp .4s .3s ease both; }
  .summary h3 { font-family:'Playfair Display',serif; font-size:1rem; font-style:italic; font-weight:400; color:var(--gold2); margin-bottom:10px; }
  .summary p { font-size:.83rem; line-height:1.85; color:rgba(250,248,244,.68); }
  .disclaimer { font-size:.65rem; color:var(--muted); letter-spacing:.05em; line-height:1.7; border-top:1px solid var(--border); padding-top:16px; }

  footer { text-align:center; padding:44px 0 36px; border-top:1px solid var(--border); margin-top:60px; }
  footer p { font-size:.64rem; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); }

  @keyframes fadeDown { from{opacity:0;transform:translateY(-14px)} to{opacity:1;transform:translateY(0)} }
  @media(max-width:580px) {
    .card { grid-template-columns:1fr auto; } .card-status { display:none; }
    #go { padding:18px 16px; font-size:.65rem; }
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="brand">
      <span class="brand-line"></span><span class="brand-dot"></span><span class="brand-line r"></span>
    </div>
    <h1 class="site-name">Sil<em>lage</em></h1>
    <p class="tagline">Comparateur de prix · Parfums · France</p>
  </header>

  <section class="search-area">
    <label class="search-label" for="q">Nom du parfum</label>
    <div class="search-row">
      <input type="text" id="q" placeholder="ex. Chanel N°5, Dior Sauvage, Lancôme…" autocomplete="off" spellcheck="false"/>
      <button id="go" onclick="doSearch()">Comparer</button>
    </div>
    <div class="pills">
      <span class="pills-label">Populaires :</span>
      <button class="pill" onclick="quick('Chanel N°5 EDP 100ml')">Chanel N°5</button>
      <button class="pill" onclick="quick('Dior Sauvage EDP 100ml')">Dior Sauvage</button>
      <button class="pill" onclick="quick('YSL Black Opium EDP 90ml')">YSL Black Opium</button>
      <button class="pill" onclick="quick('Lancôme La Vie Est Belle 100ml')">La Vie Est Belle</button>
      <button class="pill" onclick="quick('Giorgio Armani Sì EDP 100ml')">Armani Sì</button>
    </div>
  </section>

  <div id="loading"><div class="spinner"></div><p class="load-msg">Recherche des meilleurs prix…</p></div>
  <div id="error"></div>
  <div id="results"></div>

  <footer><p>Sillage — Comparateur indépendant · Données Google Shopping en temps réel</p></footer>
</div>

<script>
  const STORES = {
    'sephora':         { domain:'sephora.fr',          label:'Sephora' },
    'myorigines':      { domain:'myorigines.com',       label:'My Origines' },
    'nocibe':          { domain:'nocibe.fr',            label:'Nocibé' },
    'marionnaud':      { domain:'marionnaud.fr',        label:'Marionnaud' },
    'originesparfums': { domain:'originesparfums.com',  label:'Origines Parfums' },
    'primor':          { domain:'primor.fr',            label:'Primor' },
  };

  document.getElementById('q').addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });
  function quick(v) { document.getElementById('q').value = v; doSearch(); }

  async function doSearch() {
    const query = document.getElementById('q').value.trim();
    if (!query) { document.getElementById('q').focus(); return; }

    const go      = document.getElementById('go');
    const loading = document.getElementById('loading');
    const errDiv  = document.getElementById('error');
    const resDiv  = document.getElementById('results');

    go.disabled = true;
    loading.style.display = 'block';
    errDiv.style.display  = 'none';
    resDiv.style.display  = 'none';

    try {
      // ── Appel vers notre fonction Netlify (proxy serveur) ──
      const resp = await fetch(`/.netlify/functions/search?q=${encodeURIComponent(query)}`);
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.error || `Erreur ${resp.status}`);
      }
      const data = await resp.json();
      if (data.error) throw new Error(data.error);

      const raw = data.shopping_results || [];
      if (!raw.length) throw new Error('Aucun résultat Google Shopping. Essayez un nom plus précis, ex. "Dior Sauvage EDP 100ml".');

      // ── Filtrer sur nos parfumeries ──
      const matched = [];
      const seen    = new Set();

      for (const item of raw) {
        const src  = (item.source || '').toLowerCase();
        const link = (item.link || item.product_link || '').toLowerCase();
        for (const [key, store] of Object.entries(STORES)) {
          if (seen.has(key)) continue;
          const short = store.domain.replace(/\.(fr|com|es)$/, '');
          if (src.includes(short) || link.includes(store.domain)) {
            const price = parseFloat(String(item.price || '').replace(/[^\d,\.]/g,'').replace(',','.'));
            if (!isNaN(price) && price > 0) {
              matched.push({ key, label:store.label, price, title:item.title||query, link:item.link||item.product_link||`https://${store.domain}` });
              seen.add(key);
            }
          }
        }
      }

      matched.sort((a,b) => a.price - b.price);
      render(query, matched);

    } catch(err) {
      errDiv.innerHTML = err.message;
      errDiv.style.display = 'block';
    } finally {
      go.disabled = false;
      loading.style.display = 'none';
    }
  }

  function render(query, items) {
    const resDiv = document.getElementById('results');
    if (!items.length) {
      document.getElementById('error').innerHTML = `Aucun résultat sur les parfumeries sélectionnées pour "<em>${x(query)}</em>".<br>Essayez d'ajouter marque et volume : "Dior Sauvage EDP 100ml".`;
      document.getElementById('error').style.display = 'block';
      return;
    }

    const minP  = items[0].price;
    const maxP  = items[items.length-1].price;
    const saved = (maxP - minP).toFixed(0);

    let html = `
      <div class="results-meta">
        <div class="results-name"><em>${x(items[0].title)}</em></div>
        ${Number(saved) > 0 ? `<span class="economy-badge">Jusqu'à ${saved} € d'économies</span>` : ''}
      </div>
      <div class="cards">`;

    items.forEach((item, i) => {
      const best = i === 0 && items.length > 1;
      const diff = (item.price - minP).toFixed(0);
      html += `
        <a class="card${best?' winner':''}" href="${x(item.link)}" target="_blank" rel="noopener">
          <div>
            <div class="card-store">${x(item.label)}${best?'<span class="winner-tag">Meilleur prix</span>':''}</div>
            <div class="card-source">Voir le produit →</div>
          </div>
          <span class="card-status">En ligne</span>
          <div class="card-price">
            <span class="price-main">${item.price.toFixed(2)} €</span>
            ${Number(diff)>0?`<span class="price-diff">+${diff} € vs meilleur</span>`:''}
          </div>
        </a>`;
    });

    html += `</div>`;
    if (items.length > 1) {
      html += `<div class="summary"><h3>Notre analyse</h3><p>${x(items[0].label)} propose le meilleur prix : ${items[0].price.toFixed(2)} €, soit ${saved} € de moins que ${x(items[items.length-1].label)} (${items[items.length-1].price.toFixed(2)} €). Pensez à vérifier les frais de livraison.</p></div>`;
    }
    html += `<p class="disclaimer">Prix issus de Google Shopping en temps réel. Cliquez sur chaque résultat pour confirmer le prix en vigueur.</p>`;

    resDiv.innerHTML = html;
    resDiv.style.display = 'block';
    resDiv.scrollIntoView({ behavior:'smooth', block:'start' });
  }

  function x(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
